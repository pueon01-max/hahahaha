<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아프지 마세요.. 오늘도 화이팅! ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Nanum+Pen+Script&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:#fff8f8}
#scene{position:fixed;inset:0}canvas{display:block}#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:min(15vh,115px);pointer-events:none;z-index:3;text-align:center}
small{color:#b98a93;letter-spacing:.38em;font-size:11px;margin-bottom:22px;font-weight:600}
h1{margin:0;color:#aa526b;font-family:'Nanum Pen Script','Apple SD Gothic Neo',cursive;font-size:clamp(48px,8.2vw,85px);font-weight:400;line-height:1.18;text-shadow:0 2px 18px #f9c0d55e}
.line{display:block;min-height:1.2em}.char{display:inline-block;opacity:0;transform:translateY(15px) scale(.7);filter:blur(8px);transition:opacity .35s,transform .65s cubic-bezier(.2,1.5,.4,1),filter .6s}.char.show{opacity:1;transform:none;filter:none}.line:last-child{color:#cf7592}
#heart{width:95px;height:91px;position:fixed;left:50%;bottom:10%;transform:translateX(-50%);z-index:4;pointer-events:none;overflow:visible}
#heart path{fill:none;stroke:#e6819e;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:380;stroke-dashoffset:380;filter:drop-shadow(0 0 6px #f5a5bd)}
#heart.go path{animation:draw 2.1s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
#again{position:fixed;right:20px;top:20px;background:#ffffffc9;color:#a25f73;border:1px solid #efd1db;border-radius:999px;padding:11px 17px;z-index:8;cursor:pointer;font-size:12px}
#hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#c59ca8;font-size:10px;letter-spacing:.2em;z-index:6}
@media(max-width:600px){main{padding-top:16vh}small{font-size:9px}h1{font-size:clamp(45px,11vw,67px)}#heart{bottom:9%;width:75px}#hint{bottom:13px}}
</style></head><body>
<div id="scene"></div><canvas id="fx"></canvas>
<main><small>A LITTLE WISH FOR YOU</small><h1 aria-label="아프지 마세요.. 오늘도 화이팅!"><span class="line" id="l1"></span><span class="line" id="l2"></span></h1></main>
<svg id="heart" viewBox="0 0 120 110"><path d="M60 96 C44 82 13 59 13 35 C13 13 39 6 60 29 C80 4 107 14 107 35 C107 59 77 83 60 96"/></svg>
<button id="again">↻ 다시 보기</button><div id="hint">WITH A LITTLE PEPPERO ♡</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const host=document.querySelector('#scene');let scene,camera,renderer,group,raf,timer=0,runId=0,particles=[],fx=document.querySelector('#fx'),ctx=fx.getContext('2d');
const wait=(f,t)=>setTimeout(f,t);let timers=[];const later=(f,t)=>timers.push(wait(f,t));
function resize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(renderer){camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<600?10.1:8;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}}
function createScene(){
scene=new THREE.Scene();scene.background=new THREE.Color('#fff8f8');camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,0,8);
renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setSize(innerWidth,innerHeight);host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xbd7c8d,2.6));let light=new THREE.DirectionalLight(0xffffff,3.2);light.position.set(-3,5,7);scene.add(light);let rim=new THREE.PointLight(0xffa1ba,90);rim.position.set(3,1,4);scene.add(rim);
group=new THREE.Group();scene.add(group);
const biscuit=new THREE.MeshStandardMaterial({color:0xe7ad6b,roughness:.37,metalness:.04});
const chocolate=new THREE.MeshPhysicalMaterial({color:0x57312d,roughness:.2,clearcoat:1,clearcoatRoughness:.12});
const pink=new THREE.MeshPhysicalMaterial({color:0xec91b0,roughness:.24,clearcoat:.8});
function stick(x,y,ang,coat){const pivot=new THREE.Group();pivot.position.set(x,y,0);pivot.rotation.z=ang;const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.098,.098,3.1,20),biscuit);shaft.position.y=0;pivot.add(shaft);const top=new THREE.Mesh(new THREE.CylinderGeometry(.111,.103,2.03,24),coat);top.position.y=.53;pivot.add(top);const tip=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),coat);tip.position.y=1.55;pivot.add(tip);for(let i=0;i<17;i++){const a=Math.random()*Math.PI*2;const yy=.05+Math.random()*1.42;const sprinkle=new THREE.Mesh(new THREE.SphereGeometry(.016+Math.random()*.012,8,6),new THREE.MeshStandardMaterial({color:i%3===0?0xffe6e2:0xffcbd5}));sprinkle.position.set(Math.cos(a)*.112,yy,Math.sin(a)*.112);pivot.add(sprinkle)}group.add(pivot)}
stick(-.75,-.15,-.35,chocolate);stick(.06,-.22,.02,pink);stick(.82,-.18,.31,chocolate);
group.position.set(0,-1.35,0);group.scale.setScalar(.01);resize();
let last=performance.now();function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;group.rotation.y+=dt*.24;group.position.y=-1.35+Math.sin(now*.0017)*.10;renderer.render(scene,camera);drawParticles();raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}
function add(x,y,n=30){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*3.2;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.3,size:1.3+Math.random()*5,life:0,max:35+Math.random()*65,heart:Math.random()<.68,color:['#e78da8','#f5b3c7','#d76690','#ffffff','#f6a2b9'][Math.floor(Math.random()*5)]})}}
function drawParticles(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life++<p.max);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.vy+=.018;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life/8,(p.max-p.life)/21);ctx.fillStyle=p.color;if(p.heart){const r=p.size;ctx.beginPath();ctx.moveTo(0,r*.5);ctx.bezierCurveTo(-r*1.4,-r*.3,-r*.9,-r*1.2,0,-r*.4);ctx.bezierCurveTo(r*.9,-r*1.2,r*1.4,-r*.3,0,r*.5);ctx.fill()}else{ctx.beginPath();ctx.arc(0,0,p.size*.5,0,7);ctx.fill()}ctx.restore()}}
function write(id,s){const el=document.getElementById(id);el.replaceChildren();Array.from(s).forEach(ch=>{let e=document.createElement('span');e.className='char';e.textContent=ch===' '?'\u00a0':ch;el.appendChild(e)})}
function play(){timers.forEach(clearTimeout);timers=[];runId++;let id=runId;write('l1','아프지 마세요..');write('l2','오늘도 화이팅!');let letters=[...document.querySelectorAll('.char')];document.querySelector('#heart').classList.remove('go');void document.querySelector('#heart').offsetWidth;group.scale.setScalar(.001);group.rotation.set(0,0,0);particles=[];letters.forEach((el,i)=>later(()=>{if(id!==runId)return;el.classList.add('show');let b=el.getBoundingClientRect();add(b.left+b.width/2,b.top+b.height/2,20)},550+i*130));const at=550+letters.length*130+300;later(()=>{if(id!==runId)return;const start=performance.now();function grow(t){if(id!==runId)return;let q=Math.min(1,(t-start)/1300);let s=1-Math.pow(1-q,3);group.scale.setScalar(Math.max(.001,s));if(q<1)requestAnimationFrame(grow)}requestAnimationFrame(grow);add(innerWidth/2,innerHeight*.65,140)},at);later(()=>{document.querySelector('#heart').classList.add('go');add(innerWidth/2,innerHeight*.76,105)},at+900)}
document.querySelector('#again').onclick=play;window.addEventListener('resize',resize);createScene();play();
</script></body></html>
